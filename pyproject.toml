[project]
name = "music-rag"
version = "0.1.0"
description = "SoundQuestの音楽理論記事をcorpusとした日本語RAGシステム。音声ファイルの解析（コード進行・キー・テンポ）と結びつけた理論解説を生成する"
requires-python = ">=3.13"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "fastapi>=0.138.0",
    "flagembedding>=1.4.0",
    "google-genai>=2.10.0",
    "inngest>=0.5.18",
    "langchain-community==0.3.27",
    "librosa>=0.11.0",
    "numba>=0.60",
    "python-dotenv>=1.2.2",
    "qdrant-client>=1.18.0",
    "ragas==0.4.3",
    "requests>=2.34.2",
    "streamlit>=1.58.0",
    "tenacity>=9.1.4",
    "torch>=2.12.1",
    "uvicorn>=0.49.0",
]
